<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ずかん画 かくにん</title>
<!-- 開発用の 確認ページ（別冊05 §7）。アプリからは リンクしない。外部通信なし -->
<style>
  body { margin: 0; padding: 12px; background: #f4efe6; color: #4a3f35; font-family: system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .bar button { font-size: 14px; padding: 6px 10px; border-radius: 10px; border: 1px solid #c9bba8; background: #fff; }
  .bar button.on { background: #f28b3b; color: #fff; border-color: #f28b3b; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 10px; }
  .card { background: #fff; border-radius: 14px; padding: 8px; box-shadow: 0 2px 0 rgba(0,0,0,.08); }
  .card canvas { width: 100%; aspect-ratio: 3 / 2; display: block; }
  .card.shadow canvas { filter: brightness(0) opacity(.85); }
  .name { font-weight: bold; font-size: 17px; margin: 4px 0 2px; }
  .meta { font-size: 12px; opacity: .7; }
  ol { margin: 4px 0 0; padding-left: 20px; font-size: 13px; }
</style>
</head>
<body>
<h1>ずかん画 かくにん</h1>
<div class="bar" id="bar"></div>
<div class="grid" id="grid"></div>
<script type="module">
  import { loadZukanSet, drawFit } from '../js/zukan/registry.js';

  const params = new URLSearchParams(location.search);
  const setName = params.get('set') || 'insect';
  const only = params.get('only')?.split(',');
  const bar = document.getElementById('bar');
  const grid = document.getElementById('grid');
  let mode = params.get('mode') || 'color';
  const cardW = Number(params.get('w')) || 330; // ?w=600 で 大きく 見る
  grid.style.gridTemplateColumns = `repeat(auto-fill, minmax(min(100%, ${cardW}px), 1fr))`;

  const z = await loadZukanSet(setName);
  for (const m of [['color', 'いろ'], ['shadow', 'かげ']]) {
    const b = document.createElement('button');
    b.textContent = m[1];
    b.className = mode === m[0] ? 'on' : '';
    b.onclick = () => { mode = m[0]; render(); for (const x of bar.children) x.className = x === b ? 'on' : ''; };
    bar.append(b);
  }

  function render() {
    grid.replaceChildren();
    // なかま順に ならべる（似た 種類が となりに 来る）
    const ids = z.ids.filter((id) => !only || only.includes(id))
      .sort((a, b) => z.groups.indexOf(z.species[a].group) - z.groups.indexOf(z.species[b].group));
    for (const id of ids) {
      const card = document.createElement('div');
      card.className = 'card' + (mode === 'shadow' ? ' shadow' : '');
      const c = document.createElement('canvas');
      const ratio = Math.min(devicePixelRatio || 1, 3);
      c.width = cardW * ratio;
      c.height = Math.round(cardW * 2 / 3) * ratio;
      drawFit(c.getContext('2d'), z.art(id), c.width, c.height);
      const info = z.info(id);
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = `${info.name}`;
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = `${z.groupName(z.species[id].group)} ／ ${info.size} ／ ${info.where} ／ ${id}`;
      const ol = document.createElement('ol');
      for (const m of info.marks) {
        const li = document.createElement('li');
        li.textContent = m;
        ol.append(li);
      }
      card.append(c, name, meta, ol);
      grid.append(card);
    }
  }
  render();
</script>
</body>
</html>
